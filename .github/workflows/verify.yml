name: Verify adapter
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mcp_review
        ports:
          - 55439:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . 'Django==5.2.17' 'fastmcp==3.4.6' 'pytest~=8.4' 'pytest-django~=4.13' 'psycopg[binary]' ruff
      - run: ruff check .
      - run: python -m pytest -q -o addopts='' --ds=tests.project.settings_postgres
      - run: python tests/project/manage.py makemigrations --check --dry-run
